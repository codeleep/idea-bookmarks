name: Build IDEA Bookmarks Plugin

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a versioned Release after verification (default branch only)
        type: boolean
        default: true
  push:
    branches: [main, 'feature/**', 'fixbug/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bookmarks-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-policy:
    name: Validate branch policy
    runs-on: ubuntu-24.04
    steps:
      - name: Require feature or fixbug branches for pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          event = os.environ['EVENT_NAME']
          ref = os.environ['SOURCE_REF']
          if event == 'pull_request':
              branch = os.environ['HEAD_BRANCH']
          elif ref == 'refs/heads/main' or ref.startswith('refs/tags/v'):
              print('Main branch or release tag: allowed')
              raise SystemExit(0)
          else:
              branch = ref.removeprefix('refs/heads/')
          if not re.fullmatch(r'(feature|fixbug)/.+', branch):
              raise SystemExit('Branch must be named feature/<name> or fixbug/<name>')
          print(f'Branch policy passed: {branch}')
          PY

  build:
    name: Build and verify installable ZIP
    needs: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
      plugin_artifact_id: ${{ steps.plugin.outputs.artifact-id }}
      source_artifact_id: ${{ steps.sources.outputs.artifact-id }}
      reports_artifact_id: ${{ steps.reports.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release publication rules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install headless IDE runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core libfreetype6 libxi6 libxrender1 libxtst6

      - name: Build, run IDE smoke checks and package source
        id: build
        run: python3 tools/ci_build.py

      # Upload the plugin ZIP itself, rather than wrapping it in a second ZIP.
      - name: Upload installable plugin ZIP
        id: plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.plugin_zip }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source ZIP
        id: sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.source_zip }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums and validation reports
        id: reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookmarks-build-reports
          path: |
            dist/SHA256SUMS
            build/build-report.json
            build/runtime-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Show download and installation instructions
        env:
          PLUGIN_URL: ${{ steps.plugin.outputs.artifact-url }}
          SOURCE_URL: ${{ steps.sources.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (
              '## Bookmarks 构建通过\n\n'
              f'- [下载可安装的插件 ZIP]({os.environ["PLUGIN_URL"]})\n'
              f'- [下载完整源码 ZIP]({os.environ["SOURCE_URL"]})\n\n'
              '安装：IDEA 2026.2.4 → Settings → Plugins → 齿轮 → Install Plugin from Disk。'
              '直接选择下载的 bookmarks-desktop ZIP，无需解压。\n\n'
              '保持 IDEA 自带的 Markdown 插件启用，然后重启 IDEA。\n'
          )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(text)
          PY

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookmarks-build-diagnostics
          path: |
            build/compile.log
            build/runtime-sandbox/process.log
            build/runtime-sandbox/log/idea.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish versioned GitHub Release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release) &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: bookmarks-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download installable plugin without decompressing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.plugin_artifact_id }}
          path: release-assets
          skip-decompress: true

      - name: Download complete source without decompressing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.source_artifact_id }}
          path: release-assets
          skip-decompress: true

      - name: Download validation reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.reports_artifact_id }}
          path: release-assets/reports

      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py
